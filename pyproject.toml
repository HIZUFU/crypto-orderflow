[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-orderflow"
version = "1.1.0"
description = "Paper-only crypto order-flow analytics with multi-exchange controls"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.20.0",
  "cryptography==44.0.0",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "numpy==2.2.1",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
  "websockets==14.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.4", "pytest-asyncio==0.25.0", "ruff==0.9.2"]
postgres = ["asyncpg==0.30.0"]
ml = ["catboost==1.2.7", "pandas==2.2.3", "pyarrow==18.1.0", "scikit-learn==1.6.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
