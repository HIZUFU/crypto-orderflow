[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-orderflow"
version = "0.1.0"
description = "Paper-only crypto order-flow analytics and alerting platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.20.0",
  "fastapi==0.115.6",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
  "websockets==14.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.9.2",
]
postgres = ["asyncpg==0.30.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
